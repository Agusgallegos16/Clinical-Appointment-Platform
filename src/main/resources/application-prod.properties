# ===================================================================

# 1. Base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 2. Hibernate / JPA para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.jakarta.persistence.query.timeout=10000

# 3. Connection Pool HikariCP Calibrado para Alta Disponibilidad
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000

# 4. Consola H2 deshabilitada
spring.h2.console.enabled=false

# 5. Seguridad y JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# 6. Proveedores de Notificaciones y Emails
mail.brevo.api-key=${BREVO_API_KEY:}
mail.resend.api-key=${RESEND_API_KEY:}
app.mail.from=${SPRING_MAIL_FROM:notificaciones@consultorio.com}
app.mail.console-mode=false

# 7. Google Calendar OAuth2
app.google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}
app.google.calendar.client-id=${GOOGLE_CLIENT_ID}
app.google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
app.google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# 8. Administrador Inicial Parametrizado
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# 9. Seeder de usuarios de prueba inhabilitado
app.dev.seed-test-users=false
