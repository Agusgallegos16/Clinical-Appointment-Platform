# ===================================================================
# CONFIGURACIÓN PERFIL PRODUCCIÓN (POSTGRESQL & HIKARICP)
# ===================================================================

# HikariCP Connection Pool calibrado para producción concurrente
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate en Producción
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Google OAuth2 Client en Producción
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-oauth-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-oauth-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
