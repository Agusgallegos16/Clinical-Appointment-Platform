# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=sistema-gestion-turnos
server.port=${PORT:${SERVER_PORT:8080}}

# Perfil activo por defecto (local) si no se define SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Jackson: Serialización ISO para LocalDate / LocalDateTime y tolerancia a beans vacíos/proxies
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ===================================================================
# DATASOURCE (BASE DE DATOS PARAMETRIZADA PARA PRODUCCIÓN)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:turnosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===================================================================
# SEGURIDAD, JWT Y CORS
# ===================================================================
app.jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaSistemaDeGestionDeTurnosMedicos2026SecretKey256Bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ===================================================================
# MAIL / SMTP (CONFIGURACIÓN REAL DE CORREO SALIENTE)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.from=${SPRING_MAIL_FROM:notificaciones@consultorio.com}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_TIMEOUT:5000}

# ===================================================================
# CONFIGURACIÓN PARAMETRIZADA DEL INSTITUTO / CONSULTORIO MÉDICO
# ===================================================================
app.clinic.name=${CLINIC_NAME:Instituto Médico Consultorios}
app.clinic.address=${CLINIC_ADDRESS:Av. Principal 1234, CABA}
app.clinic.phone=${CLINIC_PHONE:+54 11 1234-5678}

# ===================================================================
# GOOGLE CALENDAR OAUTH2
# ===================================================================
app.google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}
app.google.calendar.client-id=${GOOGLE_CLIENT_ID:}
app.google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google-calendar/callback}
