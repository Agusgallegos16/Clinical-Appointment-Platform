spring.application.name=sistema-gestion-turnos-test
spring.profiles.active=test
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-jwt-secret-key-for-automated-suite-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
app.frontend.url=http://localhost:5173
app.mail.from=notificaciones@consultorio.com
app.mail.console-mode=true

app.google.calendar.enabled=false
app.google.calendar.client-id=test-gcal-client-id
app.google.calendar.client-secret=test-gcal-client-secret
app.google.calendar.redirect-uri=http://localhost:8080/api/google-calendar/callback

spring.security.oauth2.client.registration.google.client-id=test-google-oauth-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-oauth-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

app.admin.email=admin@adminconsultorio.com
app.admin.password=AdminTest123!
app.dev.seed-test-users=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.supabase.url=https://test-project.supabase.co
app.supabase.service-role-key=test-service-role-key
app.supabase.bucket.doctores=fotos-doctores
app.supabase.bucket.institucion=fotos-institucion
