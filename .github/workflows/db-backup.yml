name: Supabase to Google Drive Daily Backup

on:
  schedule:
    # Corre todos los días a las 05:00 UTC (02:00 AM hora de Argentina)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Generar Backup con Docker (Postgres 17)
        run: |
          set -e
          set -o pipefail

          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          FILENAME="backup_${TIMESTAMP}.sql.gz"
          echo "Generando volcado de base de datos en ${FILENAME}..."

          # Ejecuta pg_dump dentro del contenedor oficial de PostgreSQL 17
          docker run --rm postgres:17 pg_dump "${{ secrets.SUPABASE_DB_URL }}" | gzip > "${FILENAME}"

          # Valida que el archivo generado tenga contenido
          if [ ! -s "${FILENAME}" ]; then
            echo "ERROR: El archivo de backup se generó vacío."
            exit 1
          fi

          ls -lh "${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Configurar rclone con token OAuth
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Subir backup a Google Drive
        run: |
          echo "Subiendo ${{ env.BACKUP_FILE }} a Google Drive..."
          rclone copy "${{ env.BACKUP_FILE }}" gdrive:

      - name: Limpiar archivos antiguos (Retención de 30 días)
        run: |
          rclone delete --min-age 30d gdrive:

      - name: Limpiar temporales locales
        if: always()
        run: |
          rm -f backup_*.sql.gz
