name: Supabase to Google Drive Daily Backup

on:
  schedule:
    # Corre todos los días a las 05:00 UTC (02:00 AM hora de Argentina)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar herramientas necesarias
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17 rclone

      - name: Generar Backup de PostgreSQL (pg_dump)
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          FILENAME="backup_${TIMESTAMP}.sql.gz"
          echo "Generando volcado de base de datos en ${FILENAME}..."
          
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" | gzip > "${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Configurar rclone con token OAuth
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Subir backup a Google Drive
        run: |
          echo "Subiendo ${{ env.BACKUP_FILE }} a Google Drive..."
          rclone copy "${{ env.BACKUP_FILE }}" gdrive:

      - name: Limpiar archivos antiguos (Retención de 30 días)
        run: |
          rclone delete --min-age 30d gdrive:

      - name: Limpiar temporales locales
        if: always()
        run: |
          rm -f backup_*.sql.gz
