name: Supabase to Google Drive Daily Backup

on:
  schedule:
    # Corre todos los días a las 05:00 UTC (02:00 AM hora de Argentina)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Validar secretos requeridos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "ERROR: Falta configurar el secreto SUPABASE_DB_URL."
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "ERROR: Falta configurar el secreto BACKUP_ENCRYPTION_PASSPHRASE para cifrar el backup (ISO/IEC 27001 A.8.13 / A.8.24)."
            exit 1
          fi

      - name: Instalar rclone y gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone gnupg

      - name: Generar y cifrar Backup con Docker (Postgres 17 + AES-256 GPG)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          RAW_FILENAME="backup_${TIMESTAMP}.sql.gz"
          ENC_FILENAME="${RAW_FILENAME}.gpg"
          echo "Generando volcado de base de datos en ${RAW_FILENAME}..."

          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL"' | gzip > "${RAW_FILENAME}"

          if [ ! -s "${RAW_FILENAME}" ]; then
            echo "ERROR: El archivo de backup se generó vacío."
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback \
            --cipher-algo AES256 \
            --s2k-digest-algo SHA512 \
            --s2k-mode 3 \
            --s2k-count 65011712 \
            --passphrase-fd 3 \
            --symmetric \
            --output "${ENC_FILENAME}" "${RAW_FILENAME}" 3<<< "${BACKUP_PASSPHRASE}"

          rm -f "${RAW_FILENAME}"

          if [ ! -s "${ENC_FILENAME}" ]; then
            echo "ERROR: El archivo de backup cifrado se generó vacío."
            exit 1
          fi

          ls -lh "${ENC_FILENAME}"
          echo "BACKUP_FILE=${ENC_FILENAME}" >> "$GITHUB_ENV"

      - name: Configurar rclone con permisos restringidos
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          token = ${GDRIVE_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Subir backup cifrado a Google Drive
        run: |
          echo "Subiendo ${{ env.BACKUP_FILE }} a Google Drive..."
          rclone copy "${{ env.BACKUP_FILE }}" gdrive:

      - name: Limpiar archivos antiguos (Retención de 30 días)
        run: |
          rclone delete --min-age 30d gdrive:

      - name: Limpiar credenciales y temporales locales
        if: always()
        run: |
          rm -f backup_*.sql.gz backup_*.sql.gz.gpg ~/.config/rclone/rclone.conf
